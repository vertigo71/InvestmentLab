# ============================================================
# Long-term comparison on Shiller monthly data:
# lump sum, DCA and fixed-allocation portfolios
# over 10-year windows.
#
# Available options: see config_help.txt
# ============================================================

# Capital available at the start of each window.
initial_capital: 100000

# Annual rate earned by uninvested cash: here, the
# money market part of the 70/30 portfolios.
# 0.02 = 2%.
cash_annual_rate: 0.02

rolling:

  # 10 years: the investment horizon to evaluate.
  window_years: 10

  start_date: "1871-01-01"
  end_date: "2026-01-01"

  data_source:
    type: csv
    label: SHILLER
    path: shiller_sp_tr_monthly.csv
    frequency: MONTHLY

  strategies:
    # Everything invested in the first month.
    - type: all_in

    # Spread over the whole 10-year window.
    - type: dca
      frequency: MONTHLY

    - type: drawdown_dca
      frequency: MONTHLY
      reference_price: RUNNING_MAX
      levels: [[0.10, 2], [0.20, 3], [0.30, 4], [0.40, 5]]

    # 70% in shares, 30% in money market,
    # rebalanced every 6 months.
    - type: rebalance
      equity_weight: 0.70
      frequency: SEMIANNUAL

    # Same 70/30 start, never rebalanced:
    # shows what the rebalancing itself adds.
    - type: rebalance
      equity_weight: 0.70
      frequency: SEMIANNUAL
      tolerance: 1.0

